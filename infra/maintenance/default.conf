server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /maintenance-assets/fonts/ {
    # Only web font assets are public; the original collection stays private.
    location ~ \.(css|woff2)$ {
      try_files $uri =404;
      expires 1h;
      add_header Access-Control-Allow-Origin "*";
    }
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
