# maintenance — заглушка «ведутся технические работы» (nginx:1.27-alpine).
# Статика (index.html + логотипы) — из ConfigMap maintenance-assets, который собирает
# scripts/make-configmaps.sh из /opt/acome-offer-desk/infra/maintenance/*.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: maintenance
  template:
    metadata:
      labels:
        app: maintenance
        acom.security/tier: app
    spec:
      serviceAccountName: acom-runtime
      automountServiceAccountToken: false
      containers:
        - name: maintenance
          image: nginx:1.27-alpine
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: maintenance-config
            items:
              - key: default.conf
                path: default.conf
        - name: assets
          configMap:
            name: maintenance-assets
            items:
              - key: index.html
                path: index.html
              - key: bitrix24-logo.png
                path: maintenance-assets/bitrix24-logo.png
              - key: max-logo-2025.png
                path: maintenance-assets/max-logo-2025.png
---
apiVersion: v1
kind: Service
metadata:
  name: maintenance
spec:
  type: ClusterIP
  selector:
    app: maintenance
  ports:
    - name: http
      port: 80
      targetPort: 80
