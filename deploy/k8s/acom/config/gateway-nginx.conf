# gateway (nginx:1.27-alpine) — k8s-версия backend/nginx.conf из прод-compose.
# Отличия от прод-файла (осознанные, только из-за смены DNS-модели):
#   1) `resolver 127.0.0.11` (docker embedded DNS) заменён на kube-dns;
#   2) `set $x http://backend:8000` + `proxy_pass $x` заменены на СТАТИЧЕСКИЙ
#      `proxy_pass http://backend:8000` — в k8s имена сервисов разрешает сам
#      nginx при старте через /etc/resolv.conf (search-домены namespace), а
#      переменная в proxy_pass заставила бы nginx резолвить в рантайме и требовать
#      resolver. Статический вариант переживает рестарт пода без «застрявшего» IP.
#   3) Добавлены заголовки X-Forwarded-* на всех проксируемых локациях.
# Монтируется как ConfigMap gateway-nginx → /etc/nginx/conf.d/default.conf.
#
# Маршруты (1:1 с прод-nginx.conf):
#   /api/v1/auth/oidc/{login,register,callback}, /api/v1/auth/verify-email, /api/, /health → backend:8000
#   (/iam/ и /iam/resources/ — ЗАКОММЕНТИРОВАНЫ: Keycloak запрещён политикой
#     СБ/Тоток 23.07.2026, вход переходит на корп. IAM — см. блок ниже)
#   /maintenance-assets/                                                                  → maintenance:80
#   /                                                                                     → web:80
#   @maintenance_frontend / @api_maintenance_json / @health_unavailable — заглушки техработ

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --- OIDC-входы и регистрация (не отдавать заглушку техработ) ---
    location ^~ /api/v1/auth/oidc/login    { proxy_pass http://backend:8000; }
    location ^~ /api/v1/auth/oidc/register { proxy_pass http://backend:8000; }
    location ^~ /api/v1/auth/callback      { proxy_pass http://backend:8000; }
    location ^~ /api/v1/auth/verify-email  { proxy_pass http://backend:8000; }

    # --- API (websocket-совместимый) ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # --- Keycloak: ВЫКЛЮЧЕНО ПО ПОЛИТИКЕ (в контуре ЦОД не раскомментировать) ---
    # `policy_acom_no_keycloak_cod_jul2026` (Тоток С.И./СБ, 23.07.2026):
    #   «Keycloak полностью запрещён», альтернатива — «Мультифактор (корп. IAM)».
    # Технически: `proxy_pass http://keycloak:8080` со СТАТИЧЕСКИМ именем nginx
    #   резолвит при старте → без Service keycloak gateway не поднимется вовсе
    #   («host not found in upstream»). Поэтому блок именно выключен.
    # Переходный период (KC ещё живёт в compose, приложение уже в k8s): /iam
    #   отдаёт ХОСТОВЫЙ nginx прямо в compose-контейнер — вне k8s-контура.
    # location /iam/resources/ { proxy_pass http://keycloak:8080; }
    # location /iam/           { proxy_pass http://keycloak:8080; }

    # --- health backend ---
    location /health {
        proxy_pass http://backend:8000;
        error_page 502 503 504 = @health_unavailable;
    }

    # --- ассеты заглушки техработ ---
    location ^~ /maintenance-assets/ {
        proxy_pass http://maintenance:80;
    }

    # --- SPA ---
    location / {
        proxy_pass http://web:80;
        error_page 502 503 504 = @maintenance_frontend;
    }

    location @maintenance_frontend {
        proxy_pass http://maintenance:80;
        proxy_intercept_errors off;
    }

    location @api_maintenance_json {
        default_type application/json;
        return 503 '{"detail":"Ведутся технические работы. Попробуйте позже."}';
    }

    location @health_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable"}';
    }
}
