server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~ \.mjs$ {
    types { text/javascript mjs; }
    try_files $uri =404;
  }

  location /pdfjs/ {
    try_files $uri =404;
  }

  # SPA routing (важно!)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
