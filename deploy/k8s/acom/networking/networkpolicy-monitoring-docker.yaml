# Мониторинговое разрешение ТЕСТОВОГО контура (решение владельца B, 16.09.2026):
# dephealth (docker, project_net 172.18.0.0/16) -> поды ns acom.
# НЕ часть прод-шаблона: прод-контур согласуется с СБ отдельно.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-from-docker
  namespace: acom
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5671
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
