# RabbitMQ 3.x — конфиг через conf.d (docker-переменные RABBITMQ_* deprecated с 3.9).
# Монтируется в /etc/rabbitmq/conf.d/ (ConfigMap rabbitmq-config, ключи rabbitmq.conf
# и enabled_plugins). Файл читается ПОСЛЕ /etc/rabbitmq/rabbitmq.conf.
#
# R-E2: ТОЛЬКО TLS. listeners.tcp = none — plaintext-слушателя 5672 нет вообще.
# R-E3: mutual TLS — verify_peer + fail_if_no_peer_cert.
# Учётка default_user/default_pass приходит отдельным Secret-файлом
# (05-credentials.conf), т.к. в ConfigMap секретов нет (R-C1/C3).

listeners.tcp = none

listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.depth      = 2
ssl_options.honor_cipher_order = true
ssl_options.honor_ecc_order    = true
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# Management UI/API — тоже только по TLS (никакого :15672 plaintext, R-B4).
# fail_if_no_peer_cert=false осознанно: иначе браузер не откроет UI без клиентского
# сертификата. verify_peer остаётся (R-E3 запрещает verify=none, а не проверку «если сертификат есть»).
management.ssl.port       = 15672
management.ssl.cacertfile = /etc/rabbitmq/certs/ca.crt
management.ssl.certfile   = /etc/rabbitmq/certs/server.crt
management.ssl.keyfile    = /etc/rabbitmq/certs/server.key
management.ssl.verify     = verify_peer
management.ssl.fail_if_no_peer_cert = false

# Watermark ниже лимита контейнера: memory alarm срабатывает ДО OOM-kill.
# limits.memory=512Mi → 0.4 ≈ 205 MiB.
vm_memory_high_watermark.relative = 0.4
vm_memory_high_watermark_paging_ratio = 0.5

disk_free_limit.absolute = 500MB
