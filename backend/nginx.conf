map $http_x_forwarded_proto $proxy_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $host $proxy_effective_forwarded_proto {
  ~*\.ngrok-free\.dev$ https;
  ~*\.trycloudflare\.com$ https;
  default $proxy_forwarded_proto;
}

map $http_x_forwarded_host $proxy_forwarded_host {
  default $http_x_forwarded_host;
  "" $http_host;
}

map $http_x_forwarded_port $proxy_forwarded_port {
  default $http_x_forwarded_port;
  "" $server_port;
}

map $proxy_effective_forwarded_proto $proxy_effective_forwarded_port {
  https 443;
  default $proxy_forwarded_port;
}

resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80;
  server_name _;
  client_max_body_size 5m;
  charset utf-8;
  # IAM callback sets several JWT cookies; default 4k/8k proxy header buffers
  # turn a successful 303 into 502 and the maintenance page.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    font/woff
    font/woff2;

  set $backend_upstream http://backend:8000;
  set $iam_upstream http://iam:8100;
  set $web_upstream http://web:80;
  set $maintenance_upstream http://maintenance:80;

  # Only the browser-facing IAM endpoints are reachable through the gateway.
  # Every service-to-service IAM endpoint remains private on project_net.
  location ~ ^/iam/password/(setup|reset)$ {
    access_log off;
    proxy_pass $iam_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance_frontend;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  location ~ ^/iam/(authorize|login|logout|\.well-known/jwks\.json)$ {
    proxy_pass $iam_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance_frontend;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  location /iam/ {
    return 404;
  }

  location /internal/ {
    return 404;
  }

  # Browser navigation must receive the technical page rather than a raw proxy error.
  location = /api/v1/auth/login {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance_frontend;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  # Authorization codes are one-time secrets and must not enter access logs.
  location = /api/v1/auth/callback {
    access_log off;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance_frontend;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  location ^~ /api/v1/auth/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_maintenance_json;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  # === API ===
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 504 = @api_maintenance_json;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  # === Health check backend ===
  location /health {
    proxy_pass $backend_upstream;
    proxy_intercept_errors on;
    error_page 502 503 504 = @health_unavailable;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  location ^~ /maintenance-assets/ {
    proxy_pass $maintenance_upstream;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  # === Frontend SPA ===
  location / {
    proxy_pass $web_upstream;
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance_frontend;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  location @maintenance_frontend {
    internal;
    proxy_pass $maintenance_upstream;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Proto $proxy_effective_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Port $proxy_effective_forwarded_port;
  }

  location @api_maintenance_json {
    internal;
    default_type application/json;
    return 503 '{"detail":"Система временно недоступна. Ведутся технические работы."}';
  }

  location @health_unavailable {
    internal;
    default_type text/plain;
    return 503 "service unavailable\n";
  }
}
