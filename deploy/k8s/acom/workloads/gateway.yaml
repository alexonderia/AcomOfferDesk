# gateway — nginx:1.27-alpine с конфигом backend/nginx.conf (k8s-версия в ConfigMap).
#   * R-A1: тип Service ТОЛЬКО ClusterIP. Ни NodePort, ни hostPort, ни 0.0.0.0 —
#     наружу в кластер не публикуется ничего (решение Ф5-свод п.4);
#   * точка входа — хостовый nginx на acom-vps (решение п.11, ingress-nginx не ставим);
#   * держит /api/ (websocket) и отдаёт статику через web; OIDC-маршруты /iam/*
#     ЗАКОММЕНТИРОВАНЫ: Keycloak запрещён политикой (23.07.2026), вход — корп. IAM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        acom.security/tier: edge
    spec:
      serviceAccountName: acom-runtime
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            # только локальная проверка: readiness не должен зависеть от backend
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pidof nginx >/dev/null"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-nginx
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
