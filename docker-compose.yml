x-runtime-env: &runtime-env
  env_file:
    - ${APP_RUNTIME_ENV_FILE:-./.env}

services:
  iam_migrations:
    image: flyway/flyway:10-alpine
    container_name: iam_migrations
    restart: "no"
    env_file:
      - ${IAM_MIGRATION_ENV_FILE:-./.env.iam-db}
    command: ["migrate"]
    volumes:
      - ./iam/migrations/sql:/flyway/sql:ro
    networks:
      - project_net

  iam:
    build:
      context: .
      dockerfile: iam/Dockerfile
    container_name: iam
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ${IAM_RUNTIME_ENV_FILE:-./.env.iam}
    depends_on:
      iam_migrations:
        condition: service_completed_successfully
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  backend:
    <<: *runtime-env
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      iam:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      file_guard:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  file_guard:
    build:
      context: .
      dockerfile: file_guard/Dockerfile
    container_name: file_guard
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      FILE_GUARD_MAX_FILE_SIZE_BYTES: ${FILE_GUARD_MAX_FILE_SIZE_BYTES:-${MAX_UPLOAD_SIZE_BYTES:-5242880}}
      FILE_GUARD_ALLOW_LIBMAGIC_FALLBACK: ${FILE_GUARD_ALLOW_LIBMAGIC_FALLBACK:-true}
      FILE_GUARD_ANTIVIRUS_ENABLED: ${FILE_GUARD_ANTIVIRUS_ENABLED:-true}
      FILE_GUARD_REQUIRE_ANTIVIRUS: ${FILE_GUARD_REQUIRE_ANTIVIRUS:-false}
      FILE_GUARD_ANTIVIRUS_TIMEOUT_SECONDS: ${FILE_GUARD_ANTIVIRUS_TIMEOUT_SECONDS:-10}
      FILE_GUARD_SCAN_TIMEOUT_SECONDS: ${FILE_GUARD_SCAN_TIMEOUT_SECONDS:-30}
      FILE_GUARD_CLAMD_SOCKET_PATH: ${FILE_GUARD_CLAMD_SOCKET_PATH:-/run/clamav/clamd.sock}
      FILE_GUARD_CLAMAV_UPDATE_ON_START: ${FILE_GUARD_CLAMAV_UPDATE_ON_START:-true}
      FILE_GUARD_OFFICE_MAX_ENTRIES: ${FILE_GUARD_OFFICE_MAX_ENTRIES:-200}
      FILE_GUARD_OFFICE_MAX_TOTAL_UNCOMPRESSED_BYTES: ${FILE_GUARD_OFFICE_MAX_TOTAL_UNCOMPRESSED_BYTES:-41943040}
      FILE_GUARD_OFFICE_MAX_ENTRY_UNCOMPRESSED_BYTES: ${FILE_GUARD_OFFICE_MAX_ENTRY_UNCOMPRESSED_BYTES:-12582912}
      FILE_GUARD_OFFICE_MAX_COMPRESSION_RATIO: ${FILE_GUARD_OFFICE_MAX_COMPRESSION_RATIO:-120}
      FILE_GUARD_OFFICE_MAX_XML_SCAN_BYTES: ${FILE_GUARD_OFFICE_MAX_XML_SCAN_BYTES:-1048576}
      FILE_GUARD_OFFICE_MAX_ENTRY_NAME_LENGTH: ${FILE_GUARD_OFFICE_MAX_ENTRY_NAME_LENGTH:-255}
      FILE_GUARD_UPLOAD_READ_CHUNK_BYTES: ${FILE_GUARD_UPLOAD_READ_CHUNK_BYTES:-1048576}
      FILE_GUARD_IMAGE_MAX_WIDTH: ${FILE_GUARD_IMAGE_MAX_WIDTH:-12000}
      FILE_GUARD_IMAGE_MAX_HEIGHT: ${FILE_GUARD_IMAGE_MAX_HEIGHT:-12000}
      FILE_GUARD_IMAGE_MAX_PIXELS: ${FILE_GUARD_IMAGE_MAX_PIXELS:-40000000}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null && test -f /usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  maintenance:
    image: nginx:1.27-alpine
    container_name: maintenance
    restart: unless-stopped
    volumes:
      - ./infra/maintenance/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/maintenance/index.html:/usr/share/nginx/html/index.html:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    restart: unless-stopped
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      maintenance:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - project_net

  notifications_worker:
    <<: *runtime-env
    build:
      context: .
      dockerfile: notifications_worker/Dockerfile
    container_name: notifications_worker
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no pgrep; inspect PID 1 cmdline instead.
      test:
        - CMD
        - python
        - -c
        - "import pathlib; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\\x00', b' ').decode(); raise SystemExit(0 if 'app.main' in c else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - project_net

networks:
  project_net:
    name: project_net
    external: true

volumes:
  minio_data:
  clamav_data:
