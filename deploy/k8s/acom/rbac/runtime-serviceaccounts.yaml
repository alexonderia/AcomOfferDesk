# Единственная ServiceAccount для всех подов оверлея.
# RBAC-биндингов НЕТ вообще: поды не ходят в API k8s (нет kubectl-скриптов,
# нет docker.sock). automountServiceAccountToken: false — токен не монтируется,
# значит его нельзя украсть из пода (R-H4, «нет лишней поверхности»).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acom-runtime
automountServiceAccountToken: false
