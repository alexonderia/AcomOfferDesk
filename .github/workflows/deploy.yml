# Deploy AcomOfferDesk to acom-VPS k3s after green CI.
# SE 2.0 / MBO-2 Ф9: деплой возможен ТОЛЬКО для SHA с зелёным CI (gate-ci по head_sha).
# workflow_dispatch — break-glass без CI-гейта (явное предупреждение в логе).
# Флоу k3s (без registry): build 4 образов :sha-<short> → docker save | k3s ctr import
# → apply -k deploy/k8s/acom → flyway Job → set image + rollout → verify Jobs.
name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - test
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (empty = HEAD of test)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-test-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate-ci:
    name: Require green CI for exact SHA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'test' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || 'test' }}
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: resolve
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "Deploy candidate SHA=${SHA} trigger=${{ github.event_name }}"

      - name: Fail if no successful CI run for this SHA
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.sha }}"
          # Official Actions API: latest completed CI for the exact candidate SHA
          # must be success (old green + newer fail must block).
          # https://docs.github.com/en/rest/actions/workflow-runs
          RUN_JSON="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100"
          )"
          RUN_ID="$(
            printf '%s' "${RUN_JSON}" | jq -r --arg sha "${SHA}" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .status == "completed")]
              | sort_by(.created_at)
              | reverse
              | .[0]
              | select(.conclusion == "success")
              | .id // empty'
          )"
          if [ -z "${RUN_ID}" ]; then
            echo "FAIL: no successful CI run for SHA ${SHA}; deploy blocked" >&2
            exit 1
          fi
          echo "CI_GATE_OK: CI run ${RUN_ID} is green for ${SHA}"

      - name: Manual deploy notice
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::warning::workflow_dispatch (break-glass) — CI gate skipped for this run."

  deploy:
    name: Deploy (k3s)
    needs: gate-ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 35m
          script: |
            set -euo pipefail
            SHA="${{ needs.gate-ci.outputs.sha }}"
            SHORT="${SHA:0:7}"
            TAG="sha-${SHORT}"
            ROOT="/opt/acome-offer-desk"
            NS="acom"

            cd "${ROOT}"

            origin_url="$(git remote get-url origin)"
            case "${origin_url}" in
              *github.com/alexonderia/AcomOfferDesk*|*github.com:alexonderia/AcomOfferDesk*|\
              *github.com/vvv-web/AcomOfferDesk*|*github.com:vvv-web/AcomOfferDesk*) ;;
              *)
                echo "FAIL: origin must point to AcomOfferDesk (alexonderia or vvv-web), got ${origin_url}" >&2
                exit 1
                ;;
            esac
            # Dirty-guard: блокируем только правки TRACKED-файлов (их перезапишет checkout).
            # Untracked (backend/uploads/, deploy/monitoring/, docker-compose.monitoring.yml —
            # операционные файлы VPS) не мешают checkout --detach и не удаляются.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "FAIL: VPS checkout has modified tracked files; refusing to overwrite manual changes" >&2
              git status --short | grep -v '^??' || true
              exit 1
            fi
            git fetch --prune origin || true
            if git remote get-url upstream >/dev/null 2>&1; then
              git fetch --prune upstream || true
            fi
            git cat-file -e "${SHA}^{commit}"
            git checkout --detach "${SHA}"

            # 1. Build app images (pinned infra images: nginx/rabbitmq/minio/postgres не трогаем).
            docker build -t "acom-backend:${TAG}" -f backend/Dockerfile .
            docker build -t "acom-file-guard:${TAG}" -f file_guard/Dockerfile .
            docker build -t "acom-web:${TAG}" ./web
            docker build -t "acom-notifications-worker:${TAG}" -f notifications_worker/Dockerfile .

            # 2. Import в containerd (imagePullPolicy: Never — без импорта pod встанет в ErrImageNeverPull).
            for img in acom-backend acom-file-guard acom-web acom-notifications-worker; do
              docker save "${img}:${TAG}" | k3s ctr images import -
            done

            # 3. TLS-секреты (если отсутствуют) + app-секреты (идемпотентно, из /opt/acome-offer-desk/.env).
            for sec in postgres-tls rabbitmq-tls minio-tls; do
              if ! kubectl -n "${NS}" get secret "${sec}" >/dev/null 2>&1; then
                echo "TLS secret ${sec} missing — generating self-signed set"
                bash deploy/k8s/acom/scripts/generate-tls.sh
                break
              fi
            done
            bash deploy/k8s/acom/scripts/apply-secrets.sh

            # 4. flyway-sql ConfigMap из чекаута (миграции едут вместе с SHA).
            bash deploy/k8s/acom/scripts/make-configmaps.sh

            # 5. Apply overlay (jobs/ в kustomization сознательно НЕ включены — см. kustomization.yaml).
            kubectl apply -k deploy/k8s/acom/

            # 6. Postgres должен быть Ready до миграций.
            kubectl -n "${NS}" wait --for=condition=ready pod -l app=postgres --timeout=300s

            # 7. Бэкап БД перед миграциями (паритет с compose-эрой: pg_dump + sha256).
            BACKUP_DIR="/opt/order_database/backups"
            mkdir -p "${BACKUP_DIR}"
            BACKUP_PATH="${BACKUP_DIR}/order_database_$(date -u +'%Y%m%d_%H%M%S')_${SHORT}.dump"
            kubectl -n "${NS}" exec postgres-0 -- \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F c' > "${BACKUP_PATH}"
            sha256sum "${BACKUP_PATH}" > "${BACKUP_PATH}.sha256"
            [ -s "${BACKUP_PATH}" ] || { echo "FAIL: pg_dump produced empty backup" >&2; exit 1; }
            echo "ORDER_DB_BACKUP: ${BACKUP_PATH}"

            # 8. Flyway-миграции (идемпотентно: применённые версии пропускаются).
            kubectl -n "${NS}" delete job flyway-migrate --ignore-not-found
            kubectl apply -f deploy/k8s/acom/jobs/flyway-migrate.job.yaml
            kubectl -n "${NS}" wait --for=condition=complete job/flyway-migrate --timeout=10m

            # 9. Раскатка app-образов (container names: backend/web/file-guard/worker).
            kubectl -n "${NS}" set image deployment/backend backend="acom-backend:${TAG}"
            kubectl -n "${NS}" set image deployment/web web="acom-web:${TAG}"
            kubectl -n "${NS}" set image deployment/file-guard file-guard="acom-file-guard:${TAG}"
            kubectl -n "${NS}" set image deployment/notifications-worker worker="acom-notifications-worker:${TAG}"
            for d in backend web file-guard notifications-worker; do
              kubectl -n "${NS}" rollout status "deployment/${d}" --timeout=5m
            done

            # 10. Post-deploy verify (только чтение; образы внутри Job уже на VPS).
            kubectl -n "${NS}" delete job post-deploy-verify --ignore-not-found
            kubectl -n "${NS}" delete job db-verify --ignore-not-found
            kubectl apply -f deploy/k8s/acom/jobs/post-deploy-verify.job.yaml
            kubectl -n "${NS}" wait --for=condition=complete job/post-deploy-verify --timeout=5m
            kubectl -n "${NS}" wait --for=condition=complete job/db-verify --timeout=5m

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "FAIL: deploy changed tracked files in checkout" >&2
              git status --short | grep -v '^??' || true
              exit 1
            fi
            echo "DEPLOY_JOB_PASS SHA=${SHA} TAG=${TAG}"
