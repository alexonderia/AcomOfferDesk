name: Release Smoke (Manual)

on:
  workflow_dispatch:
    inputs:
      env_file:
        description: "Env file path used by infrastructure smoke checks"
        required: false
        default: ".env.dev"
      base_url:
        description: "Public base URL for target stand (optional)"
        required: false
        default: ""

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run infrastructure smoke checks
        env:
          ENV_FILE: ${{ inputs.env_file }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ -n "$BASE_URL" ]; then
            BASE_URL="$BASE_URL" ./scripts/smoke-infra.sh "$ENV_FILE"
          else
            ./scripts/smoke-infra.sh "$ENV_FILE"
          fi
