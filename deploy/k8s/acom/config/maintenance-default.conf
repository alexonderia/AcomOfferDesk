# maintenance — nginx:1.27-alpine со статикой «ведутся технические работы».
# Монтируется как ConfigMap maintenance-config → /etc/nginx/conf.d/default.conf.
# index.html и логотипы приезжают из ConfigMap maintenance-assets (его собирает
# scripts/make-configmaps.sh из /opt/acome-offer-desk/infra/maintenance/*).
#
# ВАЖНО: gateway проксирует на maintenance:80, поэтому default.conf не должен
# «съедать» запросы к /healthz (healthcheck пода).
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /maintenance-assets/ {
        alias /usr/share/nginx/html/maintenance-assets/;
        access_log off;
        expires 1h;
    }
}
