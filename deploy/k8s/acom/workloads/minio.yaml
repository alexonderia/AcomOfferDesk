# MinIO. R-B3: тег ЗАПИННЕН по фактической версии прод-образа — проверено в песочнице
# Ф5-3: `docker run --entrypoint minio minio/minio:latest --version` →
#   minio version RELEASE.2025-09-07T16-13-09Z (go1.24.6 linux/amd64)
# ⚠ imagePullPolicy: Never ⇒ ТЕГ ОБЯЗАН существовать в containerd. На хосте образ лежит
#   как minio/minio:latest, поэтому перед импортом нужен ретег:
#     docker tag minio/minio:latest minio/minio:RELEASE.2025-09-07T16-13-09Z
#   (scripts/import-images.sh делает это автоматически). Иначе под встанет с
#   ErrImageNeverPull. Проверено: с запінненным тегом sandbox-контейнер MinIO стартует.
#   * R-F1: TLS через --certs-dir + запуск non-root;
#   * R-F3: MINIO_ROOT_USER — НЕ root ОС (runAsUser 1000);
#   * R-C3: креды только из Secret (в compose были дефолтные minioadmin/minioadmin — нарушение);
#   * данные — PVC (не emptyDir).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        acom.security/tier: data
    spec:
      serviceAccountName: acom-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          imagePullPolicy: Never
          args:
            - "server"
            - "/data"
            - "--console-address"
            - ":9001"
            - "--certs-dir"
            - "/etc/minio/certs"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - secretRef:
                name: acom-minio-secret
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: minio-certs
              mountPath: /etc/minio/certs
              readOnly: true
      volumes:
        - name: minio-certs
          secret:
            secretName: minio-tls
            # 0440 root:1000 (fsGroup) — MinIO работает от UID 1000 и должен
            # прочитать private.key. Менять на 0444 (world-readable) не нужно.
            defaultMode: 0440
            items:
              - key: ca.crt
                path: CAs/ca.crt
              - key: public.crt
                path: public.crt
              - key: private.key
                path: private.key
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi        # сейчас 16M (38+ объектов), запас под рост
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
