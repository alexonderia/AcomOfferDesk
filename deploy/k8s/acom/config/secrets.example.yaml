# ШАБЛОН. НЕ КОММИТИТЬ. Файл лежит в git только как перечень имён (R-C1).
# Реальные значения apply-ятся скриптом scripts/apply-secrets.sh, который берёт их
# из окружения/файлов на VPS, либо создаются вручную:
#   kubectl -n acom create secret generic acom-app-secrets --from-env-file=./acom-app.env
#
# Источник имён: /opt/acome-offer-desk/.env (79 имён, см. tmp/f5-recon-20260915.md §1.4).
# Значения НИКОГДА не печатать и не логировать (R-C2).
#
# ─────────────────────────────────────────────────────────────────────────────
# Секреты, которые должны существовать до apply (4 шт.):
#
# 1) acom-app-secrets  — весь .env приложения, ПОСЛЕ перепривязки адресов:
#    APP_ENV AUTH_ENABLE_LEGACY_PASSWORD_LOGIN JWT_ALGORITHM JWT_EXP_MINUTES JWT_SECRET
#    EMAIL_ADDRESS EMAIL_APP_PASSWORD EMAIL_FROM_NAME EMAIL_REPLY_SECRET
#    EMAIL_REPLY_TTL_SECONDS EMAIL_VERIFICATION_SECRET EMAIL_VERIFICATION_TTL_SECONDS
#    IMAP_HOST IMAP_MAILBOX IMAP_PORT SMTP_HOST SMTP_PORT
#    DATABASE_URL                                  # → postgres.acom.svc.cluster.local, sslmode=verify-full
#    RABBITMQ_URL                                  # → amqps://...@rabbitmq.acom.svc.cluster.local:5671
#    S3_ACCESS_KEY S3_SECRET_KEY S3_BUCKET S3_ENDPOINT S3_PUBLIC_ENDPOINT
#    S3_PRESIGNED_GET_TTL_SECONDS S3_SECURE
#    # АВТОРИЗАЦИЯ: KEYCLOAK_* в Secret НЕ переносим — Keycloak в контуре запрещён
#    #   (политика 23.07.2026, Тоток/СБ). Приложение переходит на корп. IAM:
#    #   PR #53 «without_keycloak_and_others» (dev, 04.09.2026) убрал Keycloak из
#    #   auth.py и добавил `.env.iam.*` — имена брать из ветки dev.
#    ADMIN_ROLE_ID CONTRACTOR_ROLE_ID ECONOMIST_ROLE_ID LEAD_ECONOMIST_ROLE_ID
#    SUPERADMIN_ROLE_ID ALLOWED_CREATION_ROLE_IDS SUPERADMIN_PASSWORD
#    REGISTRATION_NOTIFY_ENABLED REGISTRATION_NOTIFY_SERVICE
#    REGISTRATION_NOTIFY_TIMEOUT_SECONDS REGISTRATION_NOTIFY_URL
#    TG_BOT_PUBLIC_URL TG_COOKIE_NAME TG_COOKIE_TTL_SECONDS TG_LINK_SECRET
#    TG_REGISTER_TTL_SECONDS TG_REQUEST_TTL_SECONDS WEB_BASE_URL PUBLIC_BACKEND_BASE_URL
#    REQUEST_UPLOAD_DIR
#    # НЕ ПЕРЕНОСИТЬ в k8s: MAX_BOT_* (max_bot в k8s не переезжает), BOT_TOKEN,
#    # BOT_API_SHARED_SECRET, MAX_LINK_SECRET, FILE_GUARD_ENABLED (он в ConfigMap).
#    # (KC_DB* не нужны: манифеста keycloak в оверлее нет — см. блок 3.)
#
# 2) acom-db-secret    — только для StatefulSet postgres (как в order_database/.env):
#    POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SUPERADMIN_PASSWORD
#
# 3) acom-kc-secret — НЕ СОЗДАЁТСЯ.
#    Keycloak в контуре AcomOfferDesk запрещён: политика `policy_acom_no_keycloak_cod_jul2026`
#    (Тоток С.И. / СБ, 23.07.2026) — «Keycloak полностью запрещён», альтернатива
#    «Мультифактор (корп. IAM)»; текущий OIDC на VPS — «не канон для ЦОД».
#    Манифест сохранён как история: excluded-by-policy/keycloak.yaml (в kustomization
#    НЕ включён). Переходный период: KC продолжает работать в compose (вне k8s), его
#    секреты остаются в /opt/acome-offer-desk/.env и в k8s не дублируются.
#
# 4) TLS-секреты (создаёт scripts/generate-tls.sh, ключи ниже обязаны совпадать):
#    postgres-tls : ca.crt server.crt server.key
#    rabbitmq-tls : ca.crt server.crt server.key client.crt client.key
#    minio-tls    : ca.crt public.crt private.key
#
# 5) storage: PVC создаются манифестами (решение «StatefulSet+PVC, не emptyDir»).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: acom-app-secrets
type: Opaque
stringData:
  CHANGE_ME_JWT_SECRET: "CHANGE_ME"
